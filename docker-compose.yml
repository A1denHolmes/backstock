services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:?must be set in .env}
      POSTGRES_USER: ${DB_USERNAME:?must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?must be set in .env}
    ports:
      - "127.0.0.1:${DB_PORT:?must be set in .env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
